name: git-snowman
description: Draw a pixel-art snowman from a GitHub account's public activity, as a looping GIF.
author: SimenVangen
branding:
  icon: cloud-snow
  color: blue

inputs:
  login:
    description: The GitHub login to draw. Defaults to the repository's owner.
    default: ${{ github.repository_owner }}
  output:
    description: Where to write the GIF, relative to the workspace.
    default: snowman.gif
  scale:
    description: How many screen pixels each art pixel becomes (1–16). 4 gives a 256×256 GIF.
    default: "4"
  mood:
    description: Draw this mood instead of the one the day set (dozing, calm, waving, blizzard or aurora). Leave empty for the real one.
    default: ""
  token:
    description: Token for the GitHub API. The workflow's built-in token is enough for public activity.
    default: ${{ github.token }}

outputs:
  path:
    description: The path of the GIF that was written.
    value: ${{ steps.draw.outputs.path }}
  summary:
    description: A one-line description of the snowman, such as "a large snowman, waving, with mittens".
    value: ${{ steps.draw.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Install git-snowman
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/git-snowman/bin"
        mkdir -p "$bin"

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)   target=x86_64-unknown-linux-gnu ;;
          Linux/ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          *)           target="" ;;
        esac

        # When the action runs from a release tag (uses: owner/git-snowman@v0),
        # GitHub checks it out under .../_actions/<owner>/<repo>/<ref>.
        # Download that release's binary; fall back to building from source.
        installed=false
        case "$GITHUB_ACTION_PATH" in
          */_actions/*/*/*)
            ref="$(basename "$GITHUB_ACTION_PATH")"
            repo="$(basename "$(dirname "$(dirname "$GITHUB_ACTION_PATH")")")/$(basename "$(dirname "$GITHUB_ACTION_PATH")")"
            if [ -n "$target" ]; then
              # A major tag such as v0 has no release of its own; use the
              # newest v0.x.y release instead.
              tag="$(gh release list --repo "$repo" --exclude-drafts --exclude-pre-releases \
                       --json tagName --jq '.[].tagName' 2>/dev/null \
                     | grep -E "^${ref}(\.|$)" | head -n 1 || true)"
              if [ -n "$tag" ] && gh release download "$tag" --repo "$repo" \
                   --pattern "git-snowman-${target}.tar.gz" --dir "$RUNNER_TEMP/git-snowman" --clobber; then
                tar -xzf "$RUNNER_TEMP/git-snowman/git-snowman-${target}.tar.gz" -C "$bin"
                echo "Using the git-snowman $tag release for $target."
                installed=true
              fi
            fi
            ;;
        esac

        if [ "$installed" = false ]; then
          echo "No prebuilt binary for this runner and ref; building from source."
          cargo build --release --locked \
            --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/git-snowman/target"
          cp "$RUNNER_TEMP/git-snowman/target/release/git-snowman" "$bin/"
        fi
        echo "$bin" >> "$GITHUB_PATH"

    - name: Draw the snowman
      id: draw
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LOGIN: ${{ inputs.login }}
        OUTPUT: ${{ inputs.output }}
        SCALE: ${{ inputs.scale }}
        MOOD: ${{ inputs.mood }}
      run: |
        set -euo pipefail
        args=("$LOGIN" --output "$OUTPUT" --scale "$SCALE")
        if [ -n "$MOOD" ]; then args+=(--mood "$MOOD"); fi
        report="$(git-snowman "${args[@]}")"
        echo "$report"
        summary="$(head -n 1 <<<"$report" | sed -E 's/^[^:]+: //; s/ \(.*$//')"
        echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "summary=$summary" >> "$GITHUB_OUTPUT"
        {
          echo "### ☃️ $LOGIN's snowman"
          echo
          echo "$report" | head -n 1
        } >> "$GITHUB_STEP_SUMMARY"
